<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>GST Invoice Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
    .active-tab { border-bottom: 3px solid #2563eb; color: #1d4ed8; font-weight: 700; }
    #toastContainer {
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform: translateY(100%);
      opacity: 0;
    }
    #toastContainer.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-24">

  <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold tracking-tight">GST Invoice & Reports</h1>
      <p class="text-xs text-blue-200">Google Sheets Live Sync</p>
    </div>
    <button onclick="toggleSettings()" class="bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded-lg text-xs font-medium border border-blue-600">
      ⚙️ API URL
    </button>
  </header>

  <div id="settingsBox" class="hidden bg-amber-50 border-b border-amber-300 p-4 shadow-inner">
    <label class="block text-xs font-bold text-amber-900 uppercase mb-1">Google Apps Script Web App URL</label>
    <input id="apiUrlInput" type="url" placeholder="https://script.google.com/macros/s/.../exec"
      class="w-full p-2.5 text-sm border border-amber-400 rounded-lg bg-white mb-2" />
    <div class="flex justify-end gap-2">
      <button onclick="saveApiUrl()" class="bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-lg">Save URL</button>
    </div>
  </div>

  <nav class="bg-white shadow-sm flex border-b border-slate-200 sticky top-[68px] z-10">
    <button id="tab-entry" onclick="switchTab('entry')" class="flex-1 py-3 text-[11px] sm:text-sm text-center active-tab">➕ Invoice</button>
    <button id="tab-customers" onclick="switchTab('customers')" class="flex-1 py-3 text-[11px] sm:text-sm text-center text-slate-500 font-medium">👥 Customers</button>
    <button id="tab-invoices" onclick="switchTab('invoices')" class="flex-1 py-3 text-[11px] sm:text-sm text-center text-slate-500 font-medium">🧾 Invoices</button>
    <button id="tab-reports" onclick="switchTab('reports')" class="flex-1 py-3 text-[11px] sm:text-sm text-center text-slate-500 font-medium">📊 Reports</button>
  </nav>

  <!-- TAB 1: NEW INVOICE -->
  <main id="view-entry" class="p-4 max-w-lg mx-auto space-y-4">
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 id="formTitle" class="text-xs font-bold uppercase tracking-wider text-slate-400">New Invoice Details</h2>
        <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-red-500 font-bold">Cancel Edit</button>
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Invoice No *</label>
          <input id="invNo" type="text" placeholder="INV-001" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Invoice Date *</label>
          <input id="invDate" type="date" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Select Customer / Company *</label>
        <select id="customerSelect" onchange="onCustomerSelected()" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white">
          <option value="">-- Select from Customer Master --</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Party Name</label>
          <input id="partyName" type="text" placeholder="Company Name" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Party GSTIN</label>
          <input id="gstin" type="text" maxlength="15" placeholder="GSTIN" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase bg-slate-50" />
        </div>
      </div>
    </section>

    <div id="itemsContainer" class="space-y-3"></div>

    <button onclick="addItem()" class="w-full py-3 border-2 border-dashed border-blue-400 text-blue-700 font-semibold rounded-xl text-sm hover:bg-blue-50 transition">
      + Add Another Item
    </button>

    <section class="bg-slate-900 text-white p-4 rounded-xl shadow-md space-y-2">
      <div class="flex justify-between text-sm text-slate-300">
        <span>Total Taxable Amount:</span>
        <span id="summaryTaxable" class="font-semibold">₹0.00</span>
      </div>
      <div class="flex justify-between text-sm text-slate-300">
        <span>Total GST Amount:</span>
        <span id="summaryGst" class="font-semibold">₹0.00</span>
      </div>
      <div class="border-t border-slate-700 pt-2 flex justify-between text-lg font-bold text-emerald-400">
        <span>Grand Total (After Tax):</span>
        <span id="summaryGrand">₹0.00</span>
      </div>
    </section>

    <button id="submitBtn" onclick="submitInvoice()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg text-base transition">
      Submit Invoice to Sheet
    </button>
  </main>

  <!-- TAB 2: CUSTOMERS -->
  <main id="view-customers" class="hidden p-4 max-w-lg mx-auto space-y-4">
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-blue-700">Add New Customer</h2>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Company Name *</label>
        <input id="newCustName" type="text" placeholder="e.g. Acme Corp" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">GSTIN Number *</label>
        <input id="newCustGstin" type="text" maxlength="15" placeholder="27AAAAA0000A1Z5" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Billing Address</label>
        <input id="newCustAddress" type="text" placeholder="City, State" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number</label>
        <input id="newCustPhone" type="tel" placeholder="9876543210" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
      </div>
      <button onclick="saveCustomer()" id="saveCustBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm shadow">
        Save Customer to Master
      </button>
    </section>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Saved Customers List</h2>
        <button onclick="loadCustomers()" class="text-xs text-blue-600 font-bold">↻ Refresh</button>
      </div>
      <div id="customersListContainer" class="divide-y divide-slate-100 text-sm"></div>
    </div>
  </main>

  <!-- TAB 3: INVOICES LIST -->
  <main id="view-invoices" class="hidden p-4 max-w-lg mx-auto space-y-3">
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-2">
      <input id="invoiceSearch" type="text" oninput="filterInvoices()" placeholder="🔍 Search invoice no, party, or GSTIN..."
        class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm outline-none" />
      
      <div class="grid grid-cols-3 gap-2">
        <select id="filterYear" onchange="filterInvoices()" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold"><option value="">All Years</option></select>
        <select id="filterQuarter" onchange="filterInvoices()" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold"><option value="">All Quarters</option></select>
        <select id="filterMonth" onchange="filterInvoices()" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold"><option value="">All Months</option></select>
      </div>
      
      <div class="flex justify-between items-center pt-1">
        <span id="invoiceCountLabel" class="text-xs text-slate-500 font-medium">Showing 0 invoices</span>
        <button onclick="loadInvoices()" class="bg-slate-100 text-blue-700 px-3 py-1 rounded-lg text-xs font-bold border border-slate-300">↻ Refresh</button>
      </div>
    </div>

    <div id="invoicesLoading" class="hidden text-center py-8 text-sm text-slate-500">Loading saved invoices...</div>
    <div id="invoicesListContainer" class="space-y-3"></div>
  </main>

  <!-- TAB 4: REPORTS -->
  <main id="view-reports" class="hidden p-4 max-w-lg mx-auto space-y-4">
    <div class="grid grid-cols-3 gap-2 bg-slate-200 p-1 rounded-xl">
      <button onclick="loadReport('hsn')" id="rep-btn-hsn" class="py-2 text-xs font-bold rounded-lg bg-white text-blue-700 shadow-sm">HSN Wise</button>
      <button onclick="loadReport('month')" id="rep-btn-month" class="py-2 text-xs font-bold rounded-lg text-slate-600">Month Wise</button>
      <button onclick="loadReport('quarter')" id="rep-btn-quarter" class="py-2 text-xs font-bold rounded-lg text-slate-600">Quarter Wise</button>
    </div>
    <div id="reportLoading" class="hidden text-center py-8 text-sm text-slate-500">Fetching live data...</div>
    <div id="reportContent" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead><tr id="reportTableHead" class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500"></tr></thead>
        <tbody id="reportTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
      </table>
    </div>
  </main>

  <!-- Toast Notification Bar -->
  <div id="toastContainer" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs sm:text-sm font-medium pointer-events-none">
    <span id="toastIcon">ℹ️</span>
    <span id="toastMessage">Notification message</span>
  </div>

  <script>
    let items = [{ hsn: '', unitPrice: '', qty: 1, gstPercent: 18 }];
    let allInvoices = [];
    let savedCustomers = [];
    const GST_RATES = [0, 5, 12, 18, 28];

    window.onload = () => {
      document.getElementById('invDate').valueAsDate = new Date();
      const savedUrl = localStorage.getItem('gst_sheet_api_url');
      if (savedUrl) {
        document.getElementById('apiUrlInput').value = savedUrl;
        loadCustomers();
      } else {
        document.getElementById('settingsBox').classList.remove('hidden');
      }
      renderItems();
    };

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toastContainer');
      const icon = document.getElementById('toastIcon');
      const msg = document.getElementById('toastMessage');

      icon.innerText = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
      msg.innerText = message;

      toast.className = `fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 text-xs sm:text-sm font-medium transition-all duration-300 ${
        type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-900 text-white'
      } show`;

      setTimeout(() => {
        toast.className = toast.className.replace('show', '');
      }, 3000);
    }

    function toggleSettings() { document.getElementById('settingsBox').classList.toggle('hidden'); }

    function saveApiUrl() {
      const url = document.getElementById('apiUrlInput').value.trim();
      if (!url.startsWith('https://script.google.com/')) { showToast('Enter a valid Apps Script URL.', 'error'); return; }
      localStorage.setItem('gst_sheet_api_url', url);
      document.getElementById('settingsBox').classList.add('hidden');
      showToast('API URL Saved!');
      loadCustomers();
    }

    function switchTab(tab) {
      ['entry', 'customers', 'invoices', 'reports'].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
        document.getElementById(`tab-${t}`).className = t === tab ? 'flex-1 py-3 text-[11px] sm:text-sm text-center active-tab' : 'flex-1 py-3 text-[11px] sm:text-sm text-center text-slate-500 font-medium';
      });
      if (tab === 'customers') loadCustomers();
      if (tab === 'invoices') loadInvoices();
      if (tab === 'reports') loadReport('hsn');
      if (tab === 'entry') loadCustomers();
    }

    async function loadCustomers() {
      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      if (!apiUrl) return;
      try {
        const res = await fetch(`${apiUrl}?type=customers`);
        savedCustomers = await res.json();
        document.getElementById('customerSelect').innerHTML = '<option value="">-- Select from Customer Master --</option>' + 
          savedCustomers.map((c, i) => `<option value="${i}">${c.companyName} (${c.gstin || 'No GSTIN'})</option>`).join('');
        
        document.getElementById('customersListContainer').innerHTML = savedCustomers.length === 0 ? '<p class="text-xs text-slate-400 py-3 text-center">No customers saved.</p>' :
          savedCustomers.map(c => `<div class="py-2.5"><h4 class="font-bold text-slate-800">${c.companyName}</h4><p class="text-xs text-slate-500">GSTIN: <b>${c.gstin || 'N/A'}</b></p></div>`).join('');
      } catch (err) { console.error(err); }
    }

    function onCustomerSelected() {
      const idx = document.getElementById('customerSelect').value;
      if (idx === "") { document.getElementById('partyName').value = ""; document.getElementById('gstin').value = ""; return; }
      document.getElementById('partyName').value = savedCustomers[idx].companyName;
      document.getElementById('gstin').value = savedCustomers[idx].gstin;
    }

    async function saveCustomer() {
      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      const companyName = document.getElementById('newCustName').value.trim();
      const gstin = document.getElementById('newCustGstin').value.trim().toUpperCase();
      if (!companyName || !gstin) { showToast('Name and GSTIN required.', 'error'); return; }
      
      const btn = document.getElementById('saveCustBtn');
      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin h-4 w-4 mx-auto text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>`;

      try {
        await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'saveCustomer', companyName, gstin }) });
        showToast('Customer saved successfully!');
        document.getElementById('newCustName').value = ''; document.getElementById('newCustGstin').value = '';
        loadCustomers();
      } catch (err) { 
        showToast('Error: ' + err.message, 'error'); 
      } finally {
        btn.disabled = false;
        btn.innerText = 'Save Customer to Master';
      }
    }

    function renderItems() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';
      items.forEach((item, idx) => {
        const price = parseFloat(item.unitPrice) || 0;
        const qty = parseFloat(item.qty) || 0;
        const taxable = price * qty;
        const gstAmt = taxable * (item.gstPercent / 100);
        const afterTax = taxable + gstAmt;

        const rateButtons = GST_RATES.map(rate => `
          <button type="button" onclick="updateItem(${idx}, 'gstPercent', ${rate})"
            class="flex-1 py-1.5 text-xs font-bold rounded-lg border ${item.gstPercent === rate ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-600 border-slate-300'}">
            ${rate}%
          </button>
        `).join('');

        container.innerHTML += `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center"><span class="text-xs font-bold uppercase text-blue-700">Item #${idx + 1}</span>${items.length > 1 ? `<button onclick="removeItem(${idx})" class="text-xs text-red-500 font-semibold">Remove</button>` : ''}</div>
            <div class="grid grid-cols-3 gap-2">
              <input type="text" value="${item.hsn}" oninput="updateItem(${idx}, 'hsn', this.value)" placeholder="HSN" class="w-full p-2 border rounded-lg text-sm" />
              <input type="number" step="0.01" value="${item.unitPrice}" oninput="updateItem(${idx}, 'unitPrice', this.value)" placeholder="Price" class="w-full p-2 border rounded-lg text-sm" />
              <input type="number" value="${item.qty}" oninput="updateItem(${idx}, 'qty', this.value)" placeholder="Qty" class="w-full p-2 border rounded-lg text-sm" />
            </div>
            <div class="flex gap-1.5">${rateButtons}</div>
            <div class="bg-slate-50 p-2.5 rounded-lg border grid grid-cols-3 text-center text-xs">
              <div>Taxable: <b>₹${taxable.toFixed(2)}</b></div>
              <div>GST: <b>₹${gstAmt.toFixed(2)}</b></div>
              <div>Total: <b>₹${afterTax.toFixed(2)}</b></div>
            </div>
          </div>
        `;
      });
      recalculateTotals();
    }

    function updateItem(idx, field, val) {
      items[idx][field] = val;
      renderItems();
    }
    function addItem() { items.push({ hsn: '', unitPrice: '', qty: 1, gstPercent: 18 }); renderItems(); }
    function removeItem(idx) { items.splice(idx, 1); renderItems(); }

    function recalculateTotals() {
      let totTaxable = 0, totGst = 0, totGrand = 0;
      items.forEach(it => {
        const taxable = (parseFloat(it.unitPrice) || 0) * (parseFloat(it.qty) || 0);
        const gst = taxable * (it.gstPercent / 100);
        totTaxable += taxable; totGst += gst; totGrand += taxable + gst;
      });
      document.getElementById('summaryTaxable').innerText = `₹${totTaxable.toFixed(2)}`;
      document.getElementById('summaryGst').innerText = `₹${totGst.toFixed(2)}`;
      document.getElementById('summaryGrand').innerText = `₹${totGrand.toFixed(2)}`;
      return { totTaxable, totGst, totGrand };
    }

    function resetForm() {
      document.getElementById('invNo').value = '';
      document.getElementById('invNo').disabled = false;
      document.getElementById('invDate').valueAsDate = new Date();
      
      document.getElementById('partyName').value = '';
      document.getElementById('partyName').disabled = false;
      document.getElementById('gstin').value = '';
      document.getElementById('gstin').disabled = false;
      document.getElementById('customerSelect').value = '';
      document.getElementById('customerSelect').disabled = false;

      document.getElementById('formTitle').innerText = 'New Invoice Details';
      document.getElementById('cancelEditBtn').classList.add('hidden');
      document.getElementById('submitBtn').innerText = 'Submit Invoice to Sheet';
      items = [{ hsn: '', unitPrice: '', qty: 1, gstPercent: 18 }];
      renderItems();
    }

    function editInvoice(invNo) {
      const inv = allInvoices.find(i => i.invoiceNo === invNo);
      if (!inv) return;
      document.getElementById('invNo').value = inv.invoiceNo;
      document.getElementById('invDate').value = inv.date;
      
      document.getElementById('partyName').value = inv.partyName;
      document.getElementById('partyName').disabled = true;
      document.getElementById('gstin').value = inv.gstin;
      document.getElementById('gstin').disabled = true;
      document.getElementById('customerSelect').disabled = true;

      items = inv.items.map(it => ({ hsn: it.hsn, unitPrice: it.unitPrice, qty: it.qty, gstPercent: it.gstPercent }));
      document.getElementById('formTitle').innerText = `Editing Invoice: ${inv.invoiceNo} (Customer Locked)`;
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      document.getElementById('submitBtn').innerText = 'Update Invoice in Sheet';
      renderItems();
      switchTab('entry');
    }

    async function submitInvoice() {
      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      if (!apiUrl) { showToast('Set API URL first.', 'error'); return; }
      const invoiceNo = document.getElementById('invNo').value.trim();
      const date = document.getElementById('invDate').value;
      const partyName = document.getElementById('partyName').value.trim();
      const gstin = document.getElementById('gstin').value.trim().toUpperCase();
      if (!invoiceNo || !date || !partyName) { showToast('Fill required fields.', 'error'); return; }

      const totals = recalculateTotals();
      const payload = {
        invoiceNo, date, partyName, gstin,
        totalTaxable: Number(totals.totTaxable.toFixed(2)),
        totalGst: Number(totals.totGst.toFixed(2)),
        grandTotal: Number(totals.totGrand.toFixed(2)),
        items: items.map(it => ({
          hsn: it.hsn || 'N/A', unitPrice: parseFloat(it.unitPrice) || 0, qty: parseFloat(it.qty) || 0,
          gstPercent: it.gstPercent, taxable: Number(((it.unitPrice||0)*(it.qty||0)).toFixed(2)),
          gstAmount: Number(((it.unitPrice||0)*(it.qty||0)*(it.gstPercent/100)).toFixed(2)),
          afterTax: Number(((it.unitPrice||0)*(it.qty||0)*(1 + it.gstPercent/100)).toFixed(2))
        }))
      };

      const btn = document.getElementById('submitBtn');
      const originalText = btn.innerText;
      btn.disabled = true;
      btn.innerHTML = `<div class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> Saving to Sheet...</div>`;

      try {
        const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
        const result = await res.json();
        if (result.status === 'success') { 
          showToast(`Invoice ${invoiceNo} saved successfully!`); 
          resetForm(); 
        } else { 
          throw new Error(result.message); 
        }
      } catch (err) { 
        showToast('Error: ' + err.message, 'error'); 
      } finally {
        btn.disabled = false;
        btn.innerText = originalText;
      }
    }

    async function loadInvoices() {
      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      if (!apiUrl) return;
      document.getElementById('invoicesLoading').classList.remove('hidden');
      try {
        const res = await fetch(`${apiUrl}?type=invoices`);
        allInvoices = await res.json();
        populateFilterDropdowns();
        filterInvoices();
      } catch (err) { console.error(err); }
      finally { document.getElementById('invoicesLoading').classList.add('hidden'); }
    }

    function populateFilterDropdowns() {
      const years = [...new Set(allInvoices.map(i => i.year))].sort().reverse();
      const quarters = [...new Set(allInvoices.map(i => i.quarter))].sort().reverse();
      const months = [...new Set(allInvoices.map(i => i.month))];
      document.getElementById('filterYear').innerHTML = '<option value="">All Years</option>' + years.map(y => `<option value="${y}">${y}</option>`).join('');
      document.getElementById('filterQuarter').innerHTML = '<option value="">All Quarters</option>' + quarters.map(q => `<option value="${q}">${q}</option>`).join('');
      document.getElementById('filterMonth').innerHTML = '<option value="">All Months</option>' + months.map(m => `<option value="${m}">${m}</option>`).join('');
    }

    function filterInvoices() {
      const search = document.getElementById('invoiceSearch').value.toLowerCase();
      const yr = document.getElementById('filterYear').value;
      const qtr = document.getElementById('filterQuarter').value;
      const mon = document.getElementById('filterMonth').value;

      const filtered = allInvoices.filter(inv => {
        return (inv.invoiceNo.toLowerCase().includes(search) || inv.partyName.toLowerCase().includes(search)) &&
               (!yr || inv.year === yr) && (!qtr || inv.quarter === qtr) && (!mon || inv.month === mon);
      });

      document.getElementById('invoiceCountLabel').innerText = `Showing ${filtered.length} invoice(s)`;
      document.getElementById('invoicesListContainer').innerHTML = filtered.length === 0 ? '<div class="bg-white p-6 text-center text-slate-400 text-sm rounded-xl">No invoices found.</div>' :
        filtered.map((inv, idx) => `
          <div class="bg-white rounded-xl shadow-sm border p-4 space-y-2">
            <div class="flex justify-between items-start">
              <div><span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-0.5 rounded">${inv.invoiceNo}</span><span class="text-xs text-slate-400 ml-2">${inv.date}</span><h3 class="font-bold text-slate-800 mt-1">${inv.partyName}</h3></div>
              <div class="text-right"><span class="block text-base font-bold text-emerald-700">₹${inv.grandTotal.toFixed(2)}</span></div>
            </div>
            <div class="flex gap-2 pt-2 border-t">
              <button onclick='generatePdf(${JSON.stringify(inv)})' class="bg-blue-600 text-white px-3 py-1 rounded font-bold text-xs">PDF</button>
              <button onclick="editInvoice('${inv.invoiceNo}')" class="bg-amber-500 text-white px-3 py-1 rounded font-bold text-xs">Edit</button>
              <button onclick="deleteInvoice('${inv.invoiceNo}')" class="bg-red-600 text-white px-3 py-1 rounded font-bold text-xs">Delete</button>
            </div>
          </div>
        `).join('');
    }

    async function deleteInvoice(invoiceNo) {
      if (!confirm(`Are you sure you want to delete Invoice ${invoiceNo}?`)) return;
      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      try {
        const res = await fetch(`${apiUrl}?action=delete&invoiceNo=${encodeURIComponent(invoiceNo)}`, { method: 'POST' });
        const result = await res.json();
        if (result.status === 'success') {
          showToast(`Invoice ${invoiceNo} deleted successfully.`);
          loadInvoices();
        } else { throw new Error(result.message); }
      } catch (err) { showToast('Failed to delete: ' + err.message, 'error'); }
    }

    function generatePdf(inv) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFont("helvetica", "bold"); doc.setFontSize(18);
      doc.text("TAX INVOICE", 105, 15, { align: "center" });
      doc.setFontSize(10);
      doc.text(`Invoice No: ${inv.invoiceNo}`, 14, 25);
      doc.text(`Date: ${inv.date}`, 14, 30);
      doc.text(`Party: ${inv.partyName}`, 14, 40);
      doc.text(`GSTIN: ${inv.gstin || 'N/A'}`, 14, 45);

      let y = 60;
      doc.setFillColor(30, 58, 138); doc.rect(14, y, 182, 8, "F");
      doc.setTextColor(255, 255, 255);
      doc.text("#", 17, y + 5.5); doc.text("HSN", 28, y + 5.5); doc.text("Qty", 60, y + 5.5); doc.text("Price", 85, y + 5.5); doc.text("Total", 170, y + 5.5);

      y += 8; doc.setTextColor(0, 0, 0); doc.setFont("helvetica", "normal");
      (inv.items || []).forEach((it, i) => {
        doc.text(String(i + 1), 17, y + 5);
        doc.text(String(it.hsn || 'N/A'), 28, y + 5);
        doc.text(String(it.qty || 0), 60, y + 5);
        doc.text(`₹${(it.unitPrice || 0).toFixed(2)}`, 85, y + 5);
        doc.text(`₹${(it.afterTax || 0).toFixed(2)}`, 170, y + 5);
        y += 8;
      });

      y += 10;
      doc.setFont("helvetica", "bold");
      doc.text(`Grand Total: ₹${(inv.grandTotal || 0).toFixed(2)}`, 130, y);
      doc.save(`Invoice_${inv.invoiceNo}.pdf`);
    }

    async function loadReport(type) {
      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      if (!apiUrl) return;
      document.getElementById('reportLoading').classList.remove('hidden');
      try {
        const res = await fetch(`${apiUrl}?type=${type}`);
        const rows = await res.json();
        document.getElementById('reportTableHead').innerHTML = type === 'hsn' ? `<th class="p-3">HSN</th><th class="p-3 text-right">Qty</th><th class="p-3 text-right">Total</th>` : `<th class="p-3">${type.toUpperCase()}</th><th class="p-3 text-right">Total</th>`;
        document.getElementById('reportTableBody').innerHTML = rows.length === 0 ? `<tr><td colspan="3" class="p-6 text-center text-slate-400">No records.</td></tr>` :
          rows.map(r => `<tr class="hover:bg-slate-50"><td class="p-3 font-bold">${r.label}</td>${type === 'hsn' ? `<td class="p-3 text-right">${r.qty}</td>` : ''}<td class="p-3 text-right font-bold text-emerald-700">₹${Number(r.total).toFixed(2)}</td></tr>`).join('');
      } catch (err) { console.error(err); }
      finally { document.getElementById('reportLoading').classList.add('hidden'); }
    }
  </script>
</body>
</html>
