<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1e3a8a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>GST Invoice Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
    .active-tab { border-bottom: 3px solid #2563eb; color: #1d4ed8; font-weight: 700; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-24">

  <!-- Top App Bar -->
  <header class="bg-blue-900 text-white p-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold tracking-tight">GST Invoice & Reports</h1>
      <p class="text-xs text-blue-200">Google Sheets Live Sync</p>
    </div>
    <button onclick="toggleSettings()" class="bg-blue-800 hover:bg-blue-700 px-3 py-1.5 rounded-lg text-xs font-medium border border-blue-600">
      ⚙️ API URL
    </button>
  </header>

  <!-- API URL Configuration Modal -->
  <div id="settingsBox" class="hidden bg-amber-50 border-b border-amber-300 p-4 shadow-inner">
    <label class="block text-xs font-bold text-amber-900 uppercase mb-1">Google Apps Script Web App URL</label>
    <input id="apiUrlInput" type="url" placeholder="https://script.google.com/macros/s/.../exec"
      class="w-full p-2.5 text-sm border border-amber-400 rounded-lg bg-white mb-2" />
    <div class="flex justify-end gap-2">
      <button onclick="saveApiUrl()" class="bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-lg">Save URL</button>
    </div>
  </div>

  <!-- 4 Navigation Tabs -->
  <nav class="bg-white shadow-sm flex border-b border-slate-200 sticky top-[68px] z-10">
    <button id="tab-entry" onclick="switchTab('entry')" class="flex-1 py-3 text-[11px] sm:text-sm text-center active-tab">➕ Invoice</button>
    <button id="tab-customers" onclick="switchTab('customers')" class="flex-1 py-3 text-[11px] sm:text-sm text-center text-slate-500 font-medium">👥 Customers</button>
    <button id="tab-invoices" onclick="switchTab('invoices')" class="flex-1 py-3 text-[11px] sm:text-sm text-center text-slate-500 font-medium">🧾 Invoices</button>
    <button id="tab-reports" onclick="switchTab('reports')" class="flex-1 py-3 text-[11px] sm:text-sm text-center text-slate-500 font-medium">📊 Reports</button>
  </nav>

  <!-- ==================== TAB 1: NEW INVOICE ==================== -->
  <main id="view-entry" class="p-4 max-w-lg mx-auto space-y-4">
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 id="formTitle" class="text-xs font-bold uppercase tracking-wider text-slate-400">New Invoice Details</h2>
        <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-red-500 font-bold">Cancel Edit</button>
      </div>
      
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Invoice No *</label>
          <input id="invNo" type="text" placeholder="INV-001" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Invoice Date *</label>
          <input id="invDate" type="date" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Select Customer / Company *</label>
        <select id="customerSelect" onchange="onCustomerSelected()" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">-- Select from Customer Master --</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Party Name</label>
          <input id="partyName" type="text" placeholder="Company Name" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Party GSTIN</label>
          <input id="gstin" type="text" maxlength="15" placeholder="GSTIN" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase bg-slate-50" />
        </div>
      </div>
    </section>

    <div id="itemsContainer" class="space-y-3"></div>

    <button onclick="addItem()" class="w-full py-3 border-2 border-dashed border-blue-400 text-blue-700 font-semibold rounded-xl text-sm hover:bg-blue-50 transition">
      + Add Another Item
    </button>

    <section class="bg-slate-900 text-white p-4 rounded-xl shadow-md space-y-2">
      <div class="flex justify-between text-sm text-slate-300">
        <span>Total Taxable Amount:</span>
        <span id="summaryTaxable" class="font-semibold">₹0.00</span>
      </div>
      <div class="flex justify-between text-sm text-slate-300">
        <span>Total GST Amount:</span>
        <span id="summaryGst" class="font-semibold">₹0.00</span>
      </div>
      <div class="border-t border-slate-700 pt-2 flex justify-between text-lg font-bold text-emerald-400">
        <span>Grand Total (After Tax):</span>
        <span id="summaryGrand">₹0.00</span>
      </div>
    </section>

    <button id="submitBtn" onclick="submitInvoice()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3.5 rounded-xl shadow-lg text-base transition">
      Submit Invoice to Sheet
    </button>
    <p id="statusMessage" class="text-center text-sm font-medium"></p>
  </main>

  <!-- ==================== TAB 2: CUSTOMER MASTER ==================== -->
  <main id="view-customers" class="hidden p-4 max-w-lg mx-auto space-y-4">
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-blue-700">Add New Customer</h2>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Company / Customer Name *</label>
        <input id="newCustName" type="text" placeholder="e.g. Acme Corp" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">GSTIN Number *</label>
        <input id="newCustGstin" type="text" maxlength="15" placeholder="27AAAAA0000A1Z5" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm uppercase" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Billing Address</label>
        <input id="newCustAddress" type="text" placeholder="City, State" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number</label>
        <input id="newCustPhone" type="tel" placeholder="9876543210" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
      </div>
      <button onclick="saveCustomer()" id="saveCustBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm shadow">
        Save Customer to Master
      </button>
      <p id="custStatusMsg" class="text-center text-xs font-medium"></p>
    </section>

    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Saved Customers List</h2>
        <button onclick="loadCustomers()" class="text-xs text-blue-600 font-bold">↻ Refresh</button>
      </div>
      <div id="customersListContainer" class="divide-y divide-slate-100 text-sm"></div>
    </div>
  </main>

  <!-- ==================== TAB 3: INVOICES LIST & ACTIONS ==================== -->
  <main id="view-invoices" class="hidden p-4 max-w-lg mx-auto space-y-3">
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-2">
      <input id="invoiceSearch" type="text" oninput="filterInvoices()" placeholder="🔍 Search invoice no, party, or GSTIN..."
        class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" />
      
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Year</label>
          <select id="filterYear" onchange="filterInvoices()" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold">
            <option value="">All Years</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Quarter</label>
          <select id="filterQuarter" onchange="filterInvoices()" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold">
            <option value="">All Quarters</option>
          </select>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Month</label>
          <select id="filterMonth" onchange="filterInvoices()" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs font-semibold">
            <option value="">All Months</option>
          </select>
        </div>
      </div>
      
      <div class="flex justify-between items-center pt-1">
        <span id="invoiceCountLabel" class="text-xs text-slate-500 font-medium">Showing 0 invoices</span>
        <button onclick="loadInvoices()" class="bg-slate-100 hover:bg-slate-200 text-blue-700 px-3 py-1 rounded-lg text-xs font-bold border border-slate-300">
          ↻ Refresh
        </button>
      </div>
    </div>

    <div id="invoicesLoading" class="hidden text-center py-8 text-sm text-slate-500">Loading saved invoices...</div>
    <div id="invoicesListContainer" class="space-y-3"></div>
  </main>

  <!-- ==================== TAB 4: GST REPORTS ==================== -->
  <main id="view-reports" class="hidden p-4 max-w-lg mx-auto space-y-4">
    <div class="grid grid-cols-3 gap-2 bg-slate-200 p-1 rounded-xl">
      <button onclick="loadReport('hsn')" id="rep-btn-hsn" class="py-2 text-xs font-bold rounded-lg bg-white text-blue-700 shadow-sm">HSN Wise</button>
      <button onclick="loadReport('month')" id="rep-btn-month" class="py-2 text-xs font-bold rounded-lg text-slate-600">Month Wise</button>
      <button onclick="loadReport('quarter')" id="rep-btn-quarter" class="py-2 text-xs font-bold rounded-lg text-slate-600">Quarter Wise</button>
    </div>

    <div id="reportLoading" class="hidden text-center py-8 text-sm text-slate-500">Fetching live data...</div>

    <div id="reportContent" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr id="reportTableHead" class="bg-slate-50 border-b border-slate-200 text-xs uppercase text-slate-500"></tr>
          </thead>
          <tbody id="reportTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let items = [{ hsn: '', unitPrice: '', qty: 1, gstPercent: 18 }];
    let allInvoices = [];
    let savedCustomers = [];
    const GST_RATES = [0, 5, 12, 18, 28];

    window.onload = () => {
      document.getElementById('invDate').valueAsDate = new Date();
      const savedUrl = localStorage.getItem('gst_sheet_api_url');
      if (savedUrl) {
        document.getElementById('apiUrlInput').value = savedUrl;
        loadCustomers();
      } else {
        document.getElementById('settingsBox').classList.remove('hidden');
      }
      renderItems();
    };

    function toggleSettings() {
      document.getElementById('settingsBox').classList.toggle('hidden');
    }

    function saveApiUrl() {
      const url = document.getElementById('apiUrlInput').value.trim();
      if (!url.startsWith('https://script.google.com/')) {
        alert('Please enter a valid Google Apps Script Web App URL.');
        return;
      }
      localStorage.setItem('gst_sheet_api_url', url);
      document.getElementById('settingsBox').classList.add('hidden');
      alert('API URL Saved!');
      loadCustomers();
    }

    function switchTab(tab) {
      ['entry', 'customers', 'invoices', 'reports'].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
        document.getElementById(`tab-${t}`).className = t === tab
          ? 'flex-1 py-3 text-[11px] sm:text-sm text-center active-tab'
          : 'flex-1 py-3 text-[11px] sm:text-sm text-center text-slate-500 font-medium';
      });
      if (tab === 'customers') loadCustomers();
      if (tab === 'invoices') loadInvoices();
      if (tab === 'reports') loadReport('hsn');
      if (tab === 'entry') loadCustomers();
    }

    async function loadCustomers() {
      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      if (!apiUrl) return;

      try {
        const res = await fetch(`${apiUrl}?type=customers`);
        savedCustomers = await res.json();
        
        const select = document.getElementById('customerSelect');
        select.innerHTML = '<option value="">-- Select from Customer Master --</option>' + 
          savedCustomers.map((c, i) => `<option value="${i}">${c.companyName} (${c.gstin || 'No GSTIN'})</option>`).join('');

        const listContainer = document.getElementById('customersListContainer');
        if (savedCustomers.length === 0) {
          listContainer.innerHTML = `<p class="text-xs text-slate-400 py-3 text-center">No customers saved yet.</p>`;
        } else {
          listContainer.innerHTML = savedCustomers.map(c => `
            <div class="py-2.5">
              <h4 class="font-bold text-slate-800">${c.companyName}</h4>
              <p class="text-xs text-slate-500">GSTIN: <b>${c.gstin || 'N/A'}</b> | Ph: ${c.phone || 'N/A'}</p>
              ${c.address ? `<p class="text-xs text-slate-400">${c.address}</p>` : ''}
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('Failed to load customers', err);
      }
    }

    function onCustomerSelected() {
      const idx = document.getElementById('customerSelect').value;
      if (idx === "") {
        document.getElementById('partyName').value = "";
        document.getElementById('gstin').value = "";
        return;
      }
      const cust = savedCustomers[idx];
      document.getElementById('partyName').value = cust.companyName;
      document.getElementById('gstin').value = cust.gstin;
    }

    async function saveCustomer() {
      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      const companyName = document.getElementById('newCustName').value.trim();
      const gstin = document.getElementById('newCustGstin').value.trim().toUpperCase();
      const address = document.getElementById('newCustAddress').value.trim();
      const phone = document.getElementById('newCustPhone').value.trim();

      if (!companyName || !gstin) {
        alert('Company Name and GSTIN are required.');
        return;
      }

      const btn = document.getElementById('saveCustBtn');
      const status = document.getElementById('custStatusMsg');
      btn.disabled = true;
      btn.innerText = 'Saving...';

      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'saveCustomer', companyName, gstin, address, phone })
        });
        const result = await res.json();
        if (result.status === 'success') {
          status.className = 'text-center text-xs font-bold text-emerald-600';
          status.innerText = '✅ Customer saved successfully!';
          document.getElementById('newCustName').value = '';
          document.getElementById('newCustGstin').value = '';
          document.getElementById('newCustAddress').value = '';
          document.getElementById('newCustPhone').value = '';
          loadCustomers();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        status.className = 'text-center text-xs font-bold text-red-600';
        status.innerText = '❌ Error: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Save Customer to Master';
      }
    }

    function renderItems() {
      const container = document.getElementById('itemsContainer');
      container.innerHTML = '';

      items.forEach((item, idx) => {
        const price = parseFloat(item.unitPrice) || 0;
        const qty = parseFloat(item.qty) || 0;
        const taxable = price * qty;
        const gstAmt = taxable * (item.gstPercent / 100);
        const afterTax = taxable + gstAmt;

        const rateButtons = GST_RATES.map(rate => `
          <button type="button" onclick="updateItem(${idx}, 'gstPercent', ${rate})"
            class="flex-1 py-1.5 text-xs font-bold rounded-lg border ${item.gstPercent === rate ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-600 border-slate-300'}">
            ${rate}%
          </button>
        `).join('');

        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3';
        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold uppercase text-blue-700">Item #${idx + 1}</span>
            ${items.length > 1 ? `<button onclick="removeItem(${idx})" class="text-xs text-red-500 font-semibold">Remove</button>` : ''}
          </div>
          
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">HSN Code *</label>
              <input type="text" value="${item.hsn}" oninput="updateItem(${idx}, 'hsn', this.value)" placeholder="8471"
                class="w-full p-2 border border-slate-300 rounded-lg text-sm" />
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">Unit Price *</label>
              <input type="number" step="0.01" value="${item.unitPrice}" oninput="updateItem(${idx}, 'unitPrice', this.value)" placeholder="0.00"
                class="w-full p-2 border border-slate-300 rounded-lg text-sm" />
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">Qty *</label>
              <input type="number" value="${item.qty}" oninput="updateItem(${idx}, 'qty', this.value)" placeholder="1"
                class="w-full p-2 border border-slate-300 rounded-lg text-sm" />
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-slate-500 mb-1">Select GST %</label>
            <div class="flex gap-1.5">${rateButtons}</div>
          </div>

          <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 grid grid-cols-3 text-center">
            <div>
              <span class="block text-[10px] text-slate-400 uppercase">Taxable</span>
              <span id="item-taxable-${idx}" class="text-xs font-bold text-slate-700">₹${taxable.toFixed(2)}</span>
            </div>
            <div class="border-x border-slate-200">
              <span class="block text-[10px] text-slate-400 uppercase">GST (${item.gstPercent}%)</span>
              <span id="item-gst-${idx}" class="text-xs font-bold text-amber-700">₹${gstAmt.toFixed(2)}</span>
            </div>
            <div>
              <span class="block text-[10px] text-slate-400 uppercase">After Tax</span>
              <span id="item-after-${idx}" class="text-xs font-bold text-emerald-700">₹${afterTax.toFixed(2)}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      recalculateTotals();
    }

    function updateItem(idx, field, value) {
      items[idx][field] = value;
      if (field === 'gstPercent') {
        renderItems();
      } else {
        const price = parseFloat(items[idx].unitPrice) || 0;
        const qty = parseFloat(items[idx].qty) || 0;
        const taxable = price * qty;
        const gstAmt = taxable * (items[idx].gstPercent / 100);
        const afterTax = taxable + gstAmt;

        document.getElementById(`item-taxable-${idx}`).innerText = `₹${taxable.toFixed(2)}`;
        document.getElementById(`item-gst-${idx}`).innerText = `₹${gstAmt.toFixed(2)}`;
        document.getElementById(`item-after-${idx}`).innerText = `₹${afterTax.toFixed(2)}`;
        recalculateTotals();
      }
    }

    function addItem() {
      items.push({ hsn: '', unitPrice: '', qty: 1, gstPercent: 18 });
      renderItems();
    }

    function removeItem(idx) {
      items.splice(idx, 1);
      renderItems();
    }

    function recalculateTotals() {
      let totTaxable = 0, totGst = 0, totGrand = 0;
      items.forEach(item => {
        const taxable = (parseFloat(item.unitPrice) || 0) * (parseFloat(item.qty) || 0);
        const gst = taxable * (item.gstPercent / 100);
        totTaxable += taxable;
        totGst += gst;
        totGrand += (taxable + gst);
      });
      document.getElementById('summaryTaxable').innerText = `₹${totTaxable.toFixed(2)}`;
      document.getElementById('summaryGst').innerText = `₹${totGst.toFixed(2)}`;
      document.getElementById('summaryGrand').innerText = `₹${totGrand.toFixed(2)}`;
      return { totTaxable, totGst, totGrand };
    }

    function resetForm() {
      document.getElementById('invNo').value = '';
      document.getElementById('invNo').disabled = false;
      document.getElementById('invDate').valueAsDate = new Date();
      document.getElementById('partyName').value = '';
      document.getElementById('gstin').value = '';
      document.getElementById('customerSelect').value = '';
      document.getElementById('formTitle').innerText = 'New Invoice Details';
      document.getElementById('cancelEditBtn').classList.add('hidden');
      document.getElementById('submitBtn').innerText = 'Submit Invoice to Sheet';
      items = [{ hsn: '', unitPrice: '', qty: 1, gstPercent: 18 }];
      renderItems();
    }

    function editInvoice(invNo) {
      const inv = allInvoices.find(i => i.invoiceNo === invNo);
      if (!inv) return;

      document.getElementById('invNo').value = inv.invoiceNo;
      document.getElementById('invNo').disabled = false; // Allow editing invoice no if needed, or keep locked
      document.getElementById('invDate').value = inv.date;
      document.getElementById('partyName').value = inv.partyName;
      document.getElementById('gstin').value = inv.gstin;

      items = inv.items.map(it => ({
        hsn: it.hsn,
        unitPrice: it.unitPrice,
        qty: it.qty,
        gstPercent: it.gstPercent
      }));

      document.getElementById('formTitle').innerText = `Editing Invoice: ${inv.invoiceNo}`;
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      document.getElementById('submitBtn').innerText = 'Update Invoice in Sheet';
      renderItems();
      switchTab('entry');
    }

    async function submitInvoice() {
      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      if (!apiUrl) {
        alert('Please set your API URL in settings first.');
        return;
      }

      const invoiceNo = document.getElementById('invNo').value.trim();
      const date = document.getElementById('invDate').value;
      const partyName = document.getElementById('partyName').value.trim();
      const gstin = document.getElementById('gstin').value.trim().toUpperCase();

      if (!invoiceNo || !date || !partyName) {
        alert('Please fill Invoice No, Date, and Party Name.');
        return;
      }

      const totals = recalculateTotals();
      const formattedItems = items.map(it => {
        const taxable = (parseFloat(it.unitPrice) || 0) * (parseFloat(it.qty) || 0);
        const gstAmount = taxable * (it.gstPercent / 100);
        return {
          hsn: it.hsn || 'N/A',
          unitPrice: parseFloat(it.unitPrice) || 0,
          qty: parseFloat(it.qty) || 0,
          gstPercent: it.gstPercent,
          taxable: Number(taxable.toFixed(2)),
          gstAmount: Number(gstAmount.toFixed(2)),
          afterTax: Number((taxable + gstAmount).toFixed(2))
        };
      });

      const payload = {
        invoiceNo, date, partyName, gstin,
        totalTaxable: Number(totals.totTaxable.toFixed(2)),
        totalGst: Number(totals.totGst.toFixed(2)),
        grandTotal: Number(totals.totGrand.toFixed(2)),
        items: formattedItems
      };

      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('statusMessage');
      btn.disabled = true;
      btn.innerText = 'Saving to Google Sheet...';
      status.innerText = '';

      try {
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          status.className = 'text-center text-sm font-bold text-emerald-600';
          status.innerText = `✅ Invoice ${invoiceNo} saved successfully!`;
          resetForm();
        } else {
          throw new Error(result.message || 'Unknown error');
        }
      } catch (err) {
        status.className = 'text-center text-sm font-bold text-red-600';
        status.innerText = '❌ Error: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Submit Invoice to Sheet';
      }
    }

    async function loadInvoices() {
      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      if (!apiUrl) return;

      const loader = document.getElementById('invoicesLoading');
      loader.classList.remove('hidden');

      try {
        const res = await fetch(`${apiUrl}?type=invoices`);
        const data = await res.json();
        if (Array.isArray(data)) {
          allInvoices = data;
          populateFilterDropdowns();
          filterInvoices();
        }
      } catch (err) {
        console.error('Failed to load invoices', err);
      } finally {
        loader.classList.add('hidden');
      }
    }

    function populateFilterDropdowns() {
      const years = [...new Set(allInvoices.map(i => i.year))].sort().reverse();
      const quarters = [...new Set(allInvoices.map(i => i.quarter))].sort().reverse();
      const months = [...new Set(allInvoices.map(i => i.month))];

      const yearSel = document.getElementById('filterYear');
      const qtrSel = document.getElementById('filterQuarter');
      const monSel = document.getElementById('filterMonth');

      const currYear = yearSel.value, currQtr = qtrSel.value, currMon = monSel.value;

      yearSel.innerHTML = '<option value="">All Years</option>' + years.map(y => `<option value="${y}">${y}</option>`).join('');
      qtrSel.innerHTML = '<option value="">All Quarters</option>' + quarters.map(q => `<option value="${q}">${q}</option>`).join('');
      monSel.innerHTML = '<option value="">All Months</option>' + months.map(m => `<option value="${m}">${m}</option>`).join('');

      yearSel.value = currYear; qtrSel.value = currQtr; monSel.value = currMon;
    }

    function filterInvoices() {
      const search = document.getElementById('invoiceSearch').value.toLowerCase();
      const yr = document.getElementById('filterYear').value;
      const qtr = document.getElementById('filterQuarter').value;
      const mon = document.getElementById('filterMonth').value;

      const filtered = allInvoices.filter(inv => {
        const matchSearch = inv.invoiceNo.toLowerCase().includes(search) ||
                            inv.partyName.toLowerCase().includes(search) ||
                            inv.gstin.toLowerCase().includes(search);
        const matchYear = !yr || inv.year === yr;
        const matchQtr = !qtr || inv.quarter === qtr;
        const matchMon = !mon || inv.month === mon;
        return matchSearch && matchYear && matchQtr && matchMon;
      });

      renderInvoicesList(filtered);
    }

    function renderInvoicesList(list) {
      const container = document.getElementById('invoicesListContainer');
      document.getElementById('invoiceCountLabel').innerText = `Showing ${list.length} invoice${list.length === 1 ? '' : 's'}`;

      if (list.length === 0) {
        container.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-slate-400 text-sm border border-slate-200">No matching invoices found.</div>`;
        return;
      }

      container.innerHTML = list.map((inv, idx) => {
        const itemsList = Array.isArray(inv.items) ? inv.items : [];
        const itemsRows = itemsList.map(it => `
          <tr class="border-t border-slate-100 text-xs">
            <td class="py-1.5 font-medium">${it.hsn || 'N/A'}</td>
            <td class="py-1.5 text-right">${it.qty || 0} × ₹${(it.unitPrice || 0).toFixed(2)}</td>
            <td class="py-1.5 text-right">${it.gstPercent || 0}%</td>
            <td class="py-1.5 text-right font-semibold">₹${(it.afterTax || 0).toFixed(2)}</td>
          </tr>
        `).join('');

        return `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 cursor-pointer active:bg-slate-50" onclick="document.getElementById('inv-details-${idx}').classList.toggle('hidden')">
              <div class="flex justify-between items-start">
                <div>
                  <span class="inline-block bg-blue-100 text-blue-800 text-xs font-bold px-2 py-0.5 rounded">${inv.invoiceNo}</span>
                  <span class="text-xs text-slate-400 ml-2">${inv.date}</span>
                  <h3 class="font-bold text-slate-800 mt-1">${inv.partyName}</h3>
                  ${inv.gstin ? `<p class="text-xs text-slate-500">GSTIN: ${inv.gstin}</p>` : ''}
                </div>
                <div class="text-right">
                  <span class="block text-base font-bold text-emerald-700">₹${inv.grandTotal.toFixed(2)}</span>
                  <span class="block text-[11px] text-slate-400">GST: ₹${inv.totalGst.toFixed(2)}</span>
                  <span class="inline-block text-[11px] text-blue-600 font-semibold mt-1">View Details ▾</span>
                </div>
              </div>
            </div>

            <div id="inv-details-${idx}" class="hidden bg-slate-50 px-4 py-3 border-t border-slate-200 space-y-3">
              <table class="w-full text-left">
                <thead>
                  <tr class="text-[10px] uppercase text-slate-400">
                    <th class="pb-1">HSN</th>
                    <th class="pb-1 text-right">Qty × Rate</th>
                    <th class="pb-1 text-right">GST</th>
                    <th class="pb-1 text-right">Total</th>
                  </tr>
                </thead>
                <tbody>${itemsRows}</tbody>
              </table>
              <div class="border-t border-slate-200 pt-2 flex flex-wrap justify-between items-center text-xs gap-2">
                <div>
                  <span>Taxable: <b>₹${inv.totalTaxable.toFixed(2)}</b></span><br/>
                  <span>Total GST: <b>₹${inv.totalGst.toFixed(2)}</b></span>
                </div>
                <div class="flex gap-2">
                  <button onclick='generatePdf(${JSON.stringify(inv)})' class="bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-lg font-bold text-xs shadow">PDF</button>
                  <button onclick="editInvoice('${inv.invoiceNo}')" class="bg-amber-500 hover:bg-amber-600 text-white px-2.5 py-1.5 rounded-lg font-bold text-xs shadow">Edit</button>
                  <button onclick="deleteInvoice('${inv.invoiceNo}')" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1.5 rounded-lg font-bold text-xs shadow">Delete</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

   async function deleteInvoice(invoiceNo) {
      if (!confirm(`Are you sure you want to delete Invoice ${invoiceNo}?`)) return;

      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      try {
        // Send POST request with action=delete in URL parameters
        const res = await fetch(`${apiUrl}?action=delete&invoiceNo=${encodeURIComponent(invoiceNo)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        const result = await res.json();
        
        if (result.status === 'success') {
          alert(`Invoice ${invoiceNo} deleted successfully.`);
          loadInvoices();
        } else {
          throw new Error(result.message || 'Unknown error');
        }
      } catch (err) {
        alert('Failed to delete invoice: ' + err.message);
      }
    }
    function generatePdf(inv) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.text("TAX INVOICE", 105, 15, { align: "center" });

      doc.setFontSize(10);
      doc.text("GSTIN: 27ABCDE1234F1Z5", 14, 25);
      doc.text("Your Company Name", 14, 30);
      doc.text("Mumbai, Maharashtra", 14, 35);

      doc.text(`Invoice No: ${inv.invoiceNo}`, 140, 25);
      doc.text(`Date: ${inv.date}`, 140, 30);

      doc.setLineWidth(0.5);
      doc.line(14, 42, 196, 42);

      doc.setFont("helvetica", "bold");
      doc.text("Details of Receiver (Billed To):", 14, 48);
      doc.setFont("helvetica", "normal");
      doc.text(`Company Name: ${inv.partyName}`, 14, 54);
      doc.text(`GSTIN: ${inv.gstin || 'N/A'}`, 14, 60);

      let y = 72;
      doc.setFillColor(30, 58, 138);
      doc.rect(14, y, 182, 8, "F");
      doc.setTextColor(255, 255, 255);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.text("#", 17, y + 5.5);
      doc.text("HSN", 28, y + 5.5);
      doc.text("Qty", 60, y + 5.5);
      doc.text("Price", 85, y + 5.5);
      doc.text("Taxable", 115, y + 5.5);
      doc.text("GST%", 145, y + 5.5);
      doc.text("Total", 170, y + 5.5);

      y += 8;
      doc.setTextColor(0, 0, 0);
      doc.setFont("helvetica", "normal");

      const itemsList = Array.isArray(inv.items) ? inv.items : [];
      itemsList.forEach((it, i) => {
        doc.text(String(i + 1), 17, y + 5);
        doc.text(String(it.hsn || 'N/A'), 28, y + 5);
        doc.text(String(it.qty || 0), 60, y + 5);
        doc.text(`₹${(it.unitPrice || 0).toFixed(2)}`, 85, y + 5);
        doc.text(`₹${(it.taxable || 0).toFixed(2)}`, 115, y + 5);
        doc.text(`${it.gstPercent || 0}%`, 145, y + 5);
        doc.text(`₹${(it.afterTax || 0).toFixed(2)}`, 170, y + 5);
        y += 8;
      });

      y += 5;
      doc.line(14, y, 196, y);
      y += 6;
      doc.text(`Total Taxable Amount: ₹${(inv.totalTaxable || 0).toFixed(2)}`, 130, y);
      y += 6;
      doc.text(`Total GST Amount: ₹${(inv.totalGst || 0).toFixed(2)}`, 130, y);
      y += 6;
      doc.setFont("helvetica", "bold");
      doc.text(`Grand Total: ₹${(inv.grandTotal || 0).toFixed(2)}`, 130, y);

      doc.save(`Invoice_${inv.invoiceNo}.pdf`);
    }

    async function loadReport(type) {
      const apiUrl = localStorage.getItem('gst_sheet_api_url');
      if (!apiUrl) return;

      ['hsn', 'month', 'quarter'].forEach(t => {
        document.getElementById(`rep-btn-${t}`).className = t === type
          ? 'py-2 text-xs font-bold rounded-lg bg-white text-blue-700 shadow-sm'
          : 'py-2 text-xs font-bold rounded-lg text-slate-600';
      });

      const loader = document.getElementById('reportLoading');
      const thead = document.getElementById('reportTableHead');
      const tbody = document.getElementById('reportTableBody');
      loader.classList.remove('hidden');
      tbody.innerHTML = '';

      try {
        const res = await fetch(`${apiUrl}?type=${type}`);
        const rows = await res.json();

        if (type === 'hsn') {
          thead.innerHTML = `<th class="p-3">HSN</th><th class="p-3 text-right">Qty</th><th class="p-3 text-right">Taxable</th><th class="p-3 text-right">GST</th><th class="p-3 text-right">Total</th>`;
        } else {
          const title = type === 'month' ? 'Month' : 'Quarter';
          thead.innerHTML = `<th class="p-3">${title}</th><th class="p-3 text-right">Taxable</th><th class="p-3 text-right">GST</th><th class="p-3 text-right">Total</th>`;
        }

        if (rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">No records found yet.</td></tr>`;
        } else {
          rows.forEach(r => {
            const qtyCell = type === 'hsn' ? `<td class="p-3 text-right">${r.qty}</td>` : '';
            tbody.innerHTML += `
              <tr class="hover:bg-slate-50">
                <td class="p-3 font-bold text-slate-800">${r.label}</td>
                ${qtyCell}
                <td class="p-3 text-right">₹${Number(r.taxable).toFixed(2)}</td>
                <td class="p-3 text-right text-amber-700">₹${Number(r.gst).toFixed(2)}</td>
                <td class="p-3 text-right font-bold text-emerald-700">₹${Number(r.total).toFixed(2)}</td>
              </tr>
            `;
          });
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Failed to load report: ${err.message}</td></tr>`;
      } finally {
        loader.classList.add('hidden');
      }
    }
  </script>
